spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=totaskflow-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/teamProject?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-migration-naming=true

logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
logging.file.name=${LOG_FILE:}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:20MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.kakao.client-id=${OAUTH2_KAKAO_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.kakao.client-secret=${OAUTH2_KAKAO_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

app.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.environment=${APP_ENVIRONMENT:local}
app.mail.from=${MAIL_FROM:no-reply@totaskflow.local}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.verification-minutes=${MAIL_VERIFICATION_MINUTES:10}
app.mail.password-reset-minutes=${PASSWORD_RESET_MINUTES:30}
app.group.invitation-hours=${GROUP_INVITATION_HOURS:72}
app.oauth.signup-cleanup-ms=${OAUTH_SIGNUP_CLEANUP_MS:900000}
app.notification.due-soon-cron=${NOTIFICATION_DUE_SOON_CRON:0 */15 * * * *}
app.calendar.rejected-task-retention-hours=${CALENDAR_REJECTED_TASK_RETENTION_HOURS:24}
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-1234567890}
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:3600}
app.jwt.refresh-seconds=${JWT_REFRESH_SECONDS:1209600}
app.jwt.pwa-refresh-idle-seconds=${JWT_PWA_REFRESH_IDLE_SECONDS:2592000}
app.jwt.pwa-refresh-absolute-seconds=${JWT_PWA_REFRESH_ABSOLUTE_SECONDS:7776000}
app.jwt.refresh-cleanup-ms=${JWT_REFRESH_CLEANUP_MS:86400000}
app.jwt.secure-cookie=${AUTH_SECURE_COOKIE:false}
app.security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.attempts=${SECURITY_RATE_LIMIT_ATTEMPTS:10}
app.security.rate-limit.window-seconds=${SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:21MB}
app.storage.local-root=${UPLOAD_LOCAL_ROOT:uploads}
app.storage.provider=${STORAGE_PROVIDER:local}
app.openai.api-key=${OPENAI_API_KEY:}
app.toss.api-base=${TOSS_API_BASE:https://api.tosspayments.com}
app.toss.client-key=${TOSS_CLIENT_KEY:}
app.toss.secret-key=${TOSS_SECRET_KEY:}
app.toss.encryption-key-base64=${PAYMENT_ENCRYPTION_KEY_BASE64:}
app.toss.test-mode=${TOSS_TEST_MODE:true}
app.subscription.live-billing-enabled=${SUBSCRIPTION_LIVE_BILLING_ENABLED:false}
app.subscription.trial-days=${SUBSCRIPTION_TRIAL_DAYS:30}
app.subscription.team-monthly-price=${SUBSCRIPTION_TEAM_MONTHLY_PRICE:9900}
app.subscription.payment-grace-days=${SUBSCRIPTION_PAYMENT_GRACE_DAYS:7}
app.subscription.lifecycle-cron=${SUBSCRIPTION_LIFECYCLE_CRON:0 15 3 * * *}
app.subscription.billing-cron=${SUBSCRIPTION_BILLING_CRON:0 5 * * * *}
app.report.mail-cron=${REPORT_MAIL_CRON:0 0 8 * * *}
app.report.retry-cron=${REPORT_RETRY_CRON:0 20 * * * *}
app.admin.enabled=${ADMIN_ENABLED:false}
app.admin.port=${ADMIN_PORT:19092}
app.admin.allowed-ips=${ADMIN_ALLOWED_IPS:127.0.0.1,::1}
app.admin.trusted-proxies=${ADMIN_TRUSTED_PROXIES:127.0.0.1,::1}
app.admin.mfa-encryption-key-base64=${ADMIN_MFA_ENCRYPTION_KEY_BASE64:}
app.admin.frontend-url=${ADMIN_FRONTEND_URL:}
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.username=${DEMO_USERNAME:demo_leader}
app.ai-report.enabled=${AI_REPORT_ENABLED:false}
app.ai-report.api-key=${OPENAI_API_KEY:}
app.ai-report.model=${OPENAI_MODEL:gpt-5.6-luna}
app.ai-report.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai-report.request-timeout=${OPENAI_REQUEST_TIMEOUT:45s}
app.ai-report.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:3000}
app.ai-report.prompt-version=v7-2-prompt-003
app.ai-report.generation-lease=${AI_REPORT_GENERATION_LEASE:4m}
app.membership.test-switch-enabled=${MEMBERSHIP_TEST_SWITCH_ENABLED:false}
