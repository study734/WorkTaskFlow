name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked private files
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(\.env($|\.)|secrets?/|credentials\.json$|service-account.*\.json$)|\.(pem|key|p12|pfx|jks|keystore|tfstate|tfvars|tfplan|md|txt)$|(^|/)backend\.hcl$'
          tracked_forbidden="$(
            git ls-files \
              | grep -E "$forbidden_pattern" \
              | grep -v -E '^(\.env\.example|README\.md|GITHUB_ACTIONS_SECRETS_SETUP\.txt)$' \
              || true
          )"
          if [[ -n "$tracked_forbidden" ]]; then
            echo "::error::Private files are tracked by Git:"
            printf '%s\n' "$tracked_forbidden"
            exit 1
          fi
      - name: Scan tracked files for high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'AKIA[0-9A-Z]{16}'
            'ASIA[0-9A-Z]{16}'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
            'sk-[A-Za-z0-9_-]{32,}'
            'gh[pousr]_[A-Za-z0-9]{30,}'
            'github_pat_[A-Za-z0-9_]{40,}'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if git grep -nI -E -e "$pattern" -- . \
              ':(exclude).env.example' \
              ':(exclude).github/workflows/ci.yml'; then
              found=1
            fi
          done
          if [[ "$found" -ne 0 ]]; then
            echo "::error::A high-confidence credential pattern was found in tracked files."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    needs: repository-safety
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    needs: repository-safety
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_ALLOW_INDEXING: "false"
          VITE_API_BASE_URL: /api/v1
          VITE_ADMIN_PORT: "19091"

  deployment-config:
    runs-on: ubuntu-latest
    needs: repository-safety
    steps:
      - uses: actions/checkout@v4
      - name: Validate single EC2 Compose configuration
        run: |
          set -euo pipefail
          BACKEND_IMAGE=ghcr.io/example/backend:test \
          WEB_IMAGE=ghcr.io/example/web:test \
          DOMAIN_NAME=example.com \
          MYSQL_APP_PASSWORD=example-password \
          MYSQL_ROOT_PASSWORD_FILE=/dev/null \
          RUNTIME_ENV_FILE=/dev/null \
            docker compose -f infra/single-ec2/compose.yml config >/dev/null

  container-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, deployment-config]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: totaskflow/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: totaskflow/web:ci
          build-args: |
            VITE_PUBLIC_SITE_URL=https://example.invalid
            VITE_API_BASE_URL=/api/v1
            VITE_ALLOW_INDEXING=false
            VITE_ADMIN_PORT=19091
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
